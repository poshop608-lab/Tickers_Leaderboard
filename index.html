<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

const MONO = "'SF Mono','Fira Code','JetBrains Mono','Courier New',monospace";
const SANS = "'SF Pro Display','system-ui','-apple-system','Helvetica Neue',sans-serif";
const G = "#34d399", R = "#fb7185", P = "#a78bfa";

const fmt    = v => { const a=Math.abs(v),s=v>=0?"+":"-"; return a>=1000?`${s}$${(a/1e3).toFixed(1)}k`:`${s}$${a.toFixed(0)}`; };
const fmtAvg = v => { const a=Math.abs(v),s=v>=0?"+":"-"; return a>=1000?`${s}$${(a/1e3).toFixed(1)}k`:`${s}$${a.toFixed(0)}`; };
const pct    = v => `${v.toFixed(1)}%`;
const computeStats = s => ({ 
  ...s, 
  winRate: s.trades > 0 ? (s.wins / s.trades) * 100 : 0, 
  avgReturn: s.trades > 0 ? s.pnl / s.trades : 0, 
  rrMade: Number(s.rrMade || 0) 
});
/* upload a base64 dataUrl to Supabase storage, return public URL */
const uploadImg = async (dataUrl, path) => {
  const blob = await fetch(dataUrl).then(r => r.blob());
  const { error } = await SUPA.storage.from('Tickers-Proofs').upload(path, blob, { contentType: blob.type, upsert: true });
  if (error) throw error;
  return SUPA.storage.from('Tickers-Proofs').getPublicUrl(path).data.publicUrl;
};

/* ── Avatar ─────────────────────────────────────────────── */
const Avatar = ({ name, pic, size=36 }) => {
  const [imgErr,setImgErr]=useState(false);
  const hues=[258,280,240,310,265,250,295];
  const h=hues[name.charCodeAt(0)%hues.length];
  const fallback=<div style={{width:size,height:size,borderRadius:"50%",flexShrink:0,background:`linear-gradient(135deg,hsl(${h},70%,72%),hsl(${h+30},80%,50%))`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.4,fontWeight:700,color:"#fff",fontFamily:SANS,boxShadow:`0 0 14px hsla(${h},80%,65%,0.5)`}}>{name[0].toUpperCase()}</div>;
  if(!pic||imgErr) return fallback;
  return <img src={pic} onError={()=>setImgErr(true)} style={{width:size,height:size,borderRadius:"50%",objectFit:"cover",flexShrink:0,boxShadow:`0 0 14px hsla(${h},80%,65%,0.45)`}}/>;
};

/* ── Spinner ─────────────────────────────────────────────── */
const Spin = () => <div style={{width:16,height:16,border:"2px solid rgba(196,181,253,0.2)",borderTop:"2px solid rgba(196,181,253,0.8)",borderRadius:"50%",animation:"spin 0.7s linear infinite",display:"inline-block"}}/>;

/* ── Toast ───────────────────────────────────────────────── */
function Toast({ msg, isError, onDone }) {
  useEffect(() => { const t=setTimeout(onDone,3200); return ()=>clearTimeout(t); }, []);
  const col = isError ? "rgba(251,113,133" : "rgba(52,211,153";
  return (
    <div style={{position:"fixed",bottom:32,left:"50%",transform:"translateX(-50%)",zIndex:9999,padding:"12px 22px",background:`${col},0.12)`,border:`1px solid ${col},0.3)`,borderRadius:99,fontFamily:MONO,fontSize:12,color:`${col},0.95)`,letterSpacing:"0.06em",boxShadow:`0 8px 32px rgba(0,0,0,0.4),0 0 30px ${col},0.15)`,animation:"fadeIn 0.3s ease",backdropFilter:"blur(20px)",whiteSpace:"nowrap"}}>
      {isError?"✕":"✓"} &nbsp;{msg}
    </div>
  );
}

/* ── PrivacyBadge ────────────────────────────────────────── */
function PrivacyBadge({ name }) {
  const [tip,setTip]=useState(false);
  return (
    <div style={{position:"relative",display:"inline-flex",alignItems:"center"}} onMouseEnter={()=>setTip(true)} onMouseLeave={()=>setTip(false)}>
      <div style={{display:"flex",alignItems:"center",gap:6,padding:"5px 11px",background:"rgba(167,139,250,0.06)",border:"1px solid rgba(167,139,250,0.2)",borderRadius:99,cursor:"default"}}>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none">
          <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94" stroke="rgba(196,181,253,0.75)" strokeWidth="2.2" strokeLinecap="round"/>
          <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" stroke="rgba(196,181,253,0.75)" strokeWidth="2.2" strokeLinecap="round"/>
          <line x1="1" y1="1" x2="23" y2="23" stroke="rgba(196,181,253,0.75)" strokeWidth="2.2" strokeLinecap="round"/>
        </svg>
        <span style={{fontFamily:MONO,fontSize:11,color:"rgba(196,181,253,0.55)",letterSpacing:"0.05em"}}>private</span>
      </div>
      {tip&&<div style={{position:"absolute",right:0,bottom:"calc(100% + 9px)",background:"#0f0f1a",border:"1px solid rgba(167,139,250,0.22)",borderRadius:10,padding:"9px 13px",whiteSpace:"nowrap",zIndex:99,boxShadow:"0 8px 32px rgba(0,0,0,0.6)"}}>
        <div style={{fontSize:12,fontFamily:SANS,fontWeight:600,color:"rgba(196,181,253,0.9)",marginBottom:3}}>🔒 Privacy mode on</div>
        <div style={{fontSize:11,fontFamily:SANS,color:"rgba(255,255,255,0.35)"}}>{name}'s P&L is kept private</div>
      </div>}
    </div>
  );
}

/* ── StatCard ────────────────────────────────────────────── */
function StatCard({ label, val, color, glow, spin, index=0 }) {
  const [hov,setHov]=useState(false);
  const [displayed,setDisplayed]=useState(val);
  const [animating,setAnimating]=useState(false);
  const gc = glow||"rgba(139,92,246,";
  const intervalRef=useRef(null);

  const doSpin = (target) => {
    if(intervalRef.current) clearInterval(intervalRef.current);
    if(!spin){ setDisplayed(target); return; }
    const numMatch = target.match(/[\d.]+/);
    const targetNum = numMatch ? parseFloat(numMatch[0]) : 0;
    if(!numMatch || targetNum===0){ setDisplayed(target); return; }
    setAnimating(true);
    const prefix = target.slice(0, numMatch.index);
    const suffix = target.slice(numMatch.index + numMatch[0].length);
    const totalFrames = 44;
    let frame = 0;
    intervalRef.current = setInterval(()=>{
      frame++;
      if(frame >= totalFrames){
        clearInterval(intervalRef.current);
        setDisplayed(target);
        setAnimating(false);
        return;
      }
      const ease = 1 - Math.pow(1 - frame/totalFrames, 4);
      const current = targetNum * ease;
      const formatted = suffix.includes('k')
        ? `${prefix}${(current/1000).toFixed(1)}k${suffix.replace('k','')}`
        : `${prefix}${Math.round(current)}${suffix}`;
      setDisplayed(formatted);
    }, 38);
  };

  // Trigger spin whenever val changes (including first real data load)
  useEffect(()=>{
    const t = setTimeout(()=>doSpin(val), index*70+50);
    return()=>{ clearTimeout(t); if(intervalRef.current) clearInterval(intervalRef.current); };
  },[val]);

  return (
    <div className="stat-card"
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      onTouchStart={()=>setHov(true)} onTouchEnd={()=>setTimeout(()=>setHov(false),400)}
      style={{
        background:hov?"rgba(255,255,255,0.05)":"rgba(255,255,255,0.025)",
        border:`1px solid ${hov?(glow?glow+"66":"rgba(139,92,246,0.5)"):(glow?glow+"22":"rgba(139,92,246,0.15)")}`,
        borderRadius:16,padding:"16px 20px",position:"relative",overflow:"hidden",cursor:"default",
        boxShadow:hov
          ?`0 0 60px ${gc}0.25),0 20px 40px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08)`
          :`0 0 20px ${gc}0.08),0 4px 16px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.03)`,
        transition:"all 0.3s cubic-bezier(0.34,1.56,0.64,1)",
        animation:`fadeInDown 0.5s cubic-bezier(0.16,1,0.3,1) ${index*70}ms both`}}>
      <div style={{position:"absolute",top:-50,right:-50,width:130,height:130,borderRadius:"50%",
        background:glow?`radial-gradient(circle,${glow}44,transparent 65%)`:"radial-gradient(circle,rgba(139,92,246,0.22),transparent 65%)",
        filter:"blur(18px)",opacity:hov?1:0.6,transition:"opacity 0.3s",pointerEvents:"none"}}/>
      <div style={{fontSize:8,fontFamily:MONO,color:"rgba(255,255,255,0.3)",marginBottom:8,letterSpacing:"0.14em",position:"relative",textTransform:"uppercase"}}>{label}</div>
      <div style={{fontSize:24,fontWeight:700,fontFamily:MONO,position:"relative",
        color:animating?(glow?glow.replace(/,$/,"")+"99)":color||"rgba(139,92,246,0.6)"):(color||(hov?"#fff":"rgba(255,255,255,0.92)")),
        textShadow:animating
          ?(glow?`0 0 24px ${glow.replace(/,$/,"")+"55)"}`:"0 0 18px rgba(139,92,246,0.5)")
          :hov?`0 0 30px ${glow||"rgba(139,92,246,1)"}`
          :glow?`0 0 16px ${glow}88`:`0 0 12px rgba(139,92,246,0.3)`,
        transition:"color 0.2s,text-shadow 0.2s",
        letterSpacing:"-0.02em"}}>
        {displayed||val}
      </div>
    </div>
  );
}

/* ── TraderRow ───────────────────────────────────────────── */
function TraderRow({ t, prev, isSelected, onClick, isLast, isNew }) {
  const [hov,setHov]=useState(false);
  const [rankAnim,setRankAnim]=useState(false);
  useEffect(()=>{ if(prev&&prev.rank!==t.rank){setRankAnim(true);setTimeout(()=>setRankAnim(false),1400);} },[t.rank]);
  const ri = r => r===1?"🏆":r===2?"🥈":r===3?"🥉":null;
  const rankDiff = prev ? prev.rank-t.rank : 0;
  return (
    <div className={isNew?"row-enter":""}>
      <div onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
        className="trader-grid"
        style={{display:"grid",gridTemplateColumns:"44px 1fr 120px 95px 70px 90px 90px",padding:"15px 20px",cursor:"pointer",borderBottom:isLast?"none":"1px solid rgba(255,255,255,0.04)",background:isSelected?"rgba(139,92,246,0.07)":hov?"rgba(255,255,255,0.028)":"transparent",transition:"background 0.2s",position:"relative"}}>
        {hov&&<>
          <div style={{position:"absolute",left:0,right:0,top:0,height:"1px",background:"linear-gradient(90deg,transparent,rgba(139,92,246,0.5),rgba(99,102,241,0.3),transparent)"}}/>
          <div style={{position:"absolute",left:0,right:0,bottom:0,height:"1px",background:"linear-gradient(90deg,transparent,rgba(139,92,246,0.15),transparent)"}}/>
        </>}
        {t.rank===1&&<div style={{position:"absolute",left:0,top:"15%",bottom:"15%",width:2,borderRadius:2,background:"rgba(139,92,246,0.9)",boxShadow:"0 0 10px rgba(139,92,246,0.8)"}}/>}
        <div style={{display:"flex",alignItems:"center",gap:3}}>
          {ri(t.rank)?<span style={{fontSize:18}}>{ri(t.rank)}</span>:<span style={{fontFamily:MONO,fontSize:12,color:rankAnim?"rgba(167,139,250,0.9)":"rgba(255,255,255,0.25)",textShadow:rankAnim?"0 0 12px rgba(167,139,250,0.8)":"none",transition:"all 0.4s",fontWeight:500}}>{t.rank}</span>}
          {rankDiff>0&&<span style={{fontSize:8,color:G,fontFamily:MONO,animation:"floatUp 1.4s ease forwards"}}>▲{rankDiff}</span>}
          {rankDiff<0&&<span style={{fontSize:8,color:R,fontFamily:MONO}}>▼{Math.abs(rankDiff)}</span>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0}}>
          <Avatar name={t.name} pic={t.pic} size={30}/>
          <div style={{display:"flex",alignItems:"center",gap:7,minWidth:0}}>
            <span style={{fontSize:14,fontWeight:700,fontFamily:SANS,color:hov?"#fff":"rgba(255,255,255,0.92)",textShadow:hov?"0 0 18px rgba(139,92,246,0.5)":"none",transition:"all 0.2s",letterSpacing:"-0.02em",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.name}</span>
            {t.role==="admin"&&<span style={{fontSize:8,fontFamily:MONO,fontWeight:700,letterSpacing:"0.08em",padding:"2px 7px",background:"linear-gradient(135deg,rgba(139,92,246,0.25),rgba(99,102,241,0.15))",border:"1px solid rgba(139,92,246,0.45)",borderRadius:99,color:"rgba(196,181,253,0.95)",whiteSpace:"nowrap",boxShadow:"0 0 10px rgba(139,92,246,0.3)"}}>ADMIN</span>}
          </div>
        </div>
        <div style={{textAlign:"right",display:"flex",alignItems:"center",justifyContent:"flex-end"}}>
          {t.hidePnl&&t.trades>0?<PrivacyBadge name={t.name}/>:<span style={{fontFamily:MONO,fontSize:13,fontWeight:700,color:t.pnl>=0?G:R,textShadow:`0 0 ${hov?20:8}px ${t.pnl>=0?G:R}${hov?"cc":"55"}`,transition:"text-shadow 0.2s"}}>{fmt(t.pnl)}</span>}
        </div>
        <div className="hide-col" style={{textAlign:"right",display:"flex",alignItems:"center",justifyContent:"flex-end"}}>
          <span style={{fontFamily:MONO,fontSize:12,fontWeight:600,color:t.winRate>=60?"#86efac":t.winRate>=40?"#fde68a":R}}>{pct(t.winRate)}</span>
        </div>
        <div className="hide-col" style={{textAlign:"right",display:"flex",alignItems:"center",justifyContent:"flex-end"}}>
          <span style={{fontFamily:MONO,fontSize:12,color:"rgba(255,255,255,0.4)",fontWeight:500}}>{t.trades}</span>
        </div>
        <div className="hide-col" style={{textAlign:"right",display:"flex",alignItems:"center",justifyContent:"flex-end"}}>
          {t.hidePnl&&t.trades>0?<span style={{fontFamily:MONO,fontSize:12,color:"rgba(139,92,246,0.25)"}}>——</span>:<span style={{fontFamily:MONO,fontSize:12,fontWeight:600,color:t.avgReturn>=0?"rgba(134,239,172,0.9)":"rgba(251,113,133,0.9)"}}>{fmtAvg(t.avgReturn)}</span>}
        </div>
        <div className="hide-col" style={{textAlign:"right",display:"flex",alignItems:"center",justifyContent:"flex-end"}}>
          {t.rrMade>0
            ?<span style={{fontFamily:MONO,fontSize:12,fontWeight:700,
                color:t.rrMade>=3?"rgba(196,181,253,0.95)":t.rrMade>=2?"rgba(196,181,253,0.8)":"rgba(253,230,138,0.75)",
                textShadow:hov?`0 0 10px rgba(139,92,246,0.5)`:"none",
                transition:"text-shadow 0.2s"}}>{t.rrMade.toFixed(1)}R</span>
            :<span style={{fontFamily:MONO,fontSize:12,color:"rgba(255,255,255,0.15)"}}>—</span>
          }
        </div>
      </div>
      {isSelected&&(

              {l:"P&L",        v:t.hidePnl&&t.trades>0?"private":fmt(t.pnl),      c:t.hidePnl&&t.trades>0?"rgba(167,139,250,0.4)":t.pnl>=0?G:R},

              {l:"TRADES",     v:t.trades,                             c:"rgba(255,255,255,0.75)"},
              {l:"WINS",       v:t.wins,                               c:G},

              {l:"AVG RETURN", v:t.hidePnl&&t.trades>0?"private":fmt(t.avgReturn), c:t.hidePnl&&t.trades>0?"rgba(167,139,250,0.4)":t.avgReturn>=0?G:R},
              {l:"RR MADE",   v:t.rrMade>0?t.rrMade.toFixed(1)+"R":"—", c:t.rrMade>=2?"rgba(167,139,250,0.95)":t.rrMade>=1?"rgba(253,230,138,0.8)":"rgba(255,255,255,0.3)"},
            ].map(c=>(
              <div key={c.l} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:12,padding:"11px 13px"}}>
                <div style={{fontSize:9,fontFamily:MONO,letterSpacing:"0.1em",color:"rgba(255,255,255,0.3)",marginBottom:6}}>{c.l}</div>
                <div style={{fontFamily:MONO,fontSize:17,fontWeight:700,color:c.c,textShadow:`0 0 12px ${c.c}55`}}>{c.v}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ── InputField ──────────────────────────────────────────── */

  const [show,setShow]=useState(false);
  const [hovEye,setHovEye]=useState(false);

/* ── LoginScreen ─────────────────────────────────────────── */
const LoginScreen = React.memo(function LoginScreen({ onLogin, onClose }) {
  const [mode,setMode]               = useState("choose");
  const [username,setUsername]       = useState("");
  const [email,setEmail]             = useState("");
  const [password,setPassword]       = useState("");
  const [confirm,setConfirm]         = useState("");
  const [preview,setPreview]         = useState(null);
  const [err,setErr]                 = useState("");
  const [loading,setLoading]         = useState(false);
  const [pendingUid,setPendingUid]   = useState(null);
  const fileRef = useRef();

  // Poll every 3 seconds when on pending screen — auto-login when approved
  useEffect(()=>{
    if(mode!=="pending"||!pendingUid) return;
    const poll = setInterval(async()=>{
      try {
        const {data:p} = await SUPA.from('profiles').select('*').eq('id',pendingUid).single();
        if(p && p.status==='approved') {
          clearInterval(poll);
          // Wait a moment for trader row to be created
          setTimeout(async()=>{
            // Check trader row exists
            const {data:trader} = await SUPA.from('traders').select('*').eq('id',pendingUid).maybeSingle();
            if(trader) {
              onLogin({name:p.display_name, pic:p.avatar_url, id:p.id, email:p.email, role:p.role||'member'});
            } else {
              // Trader row not created yet, wait another second
              setTimeout(async()=>{
                onLogin({name:p.display_name, pic:p.avatar_url, id:p.id, email:p.email, role:p.role||'member'});
              }, 2000);
            }
          }, 1500);
        }
      } catch(e){}
    }, 3000);
    return()=>clearInterval(poll);
  },[mode,pendingUid]);

  const handlePic = e => { const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>setPreview(ev.target.result); r.readAsDataURL(f); };
  const reset = m => { setMode(m);setErr("");setUsername("");setEmail("");setPassword("");setConfirm("");setPreview(null); };

  const doRegister = async () => {
    setErr("");
    if(!preview)               return setErr("Profile picture is required.");
    if(!username.trim())       return setErr("Username is required.");
    if(username.trim().length<3) return setErr("Username must be at least 3 characters.");
    if(!/\S+@\S+\.\S+/.test(email)) return setErr("Enter a valid email address.");
    if(password.length<6)      return setErr("Password must be at least 6 characters.");
    if(password!==confirm)     return setErr("Passwords don't match.");
    setLoading(true);
    try {
      const { data:ex } = await SUPA.from('profiles').select('id').eq('username',username.trim().toLowerCase()).maybeSingle();
      if(ex) { setLoading(false); return setErr("Username already taken."); }
      const { data:auth,error:authErr } = await SUPA.auth.signUp({ email, password });
      if(authErr) { setLoading(false); return setErr(authErr.message); }
      if(!auth || !auth.user) { setLoading(false); return setErr("✉️ Check your email — a confirmation link was sent."); }
      const uid = auth.user.id;
      const avatarUrl = await uploadImg(preview, `avatars/${uid}.jpg`);
      await SUPA.from('profiles').insert({ id:uid, username:username.trim().toLowerCase(), display_name:username.trim(), avatar_url:avatarUrl, email, status:'pending', role:'member' });
      setLoading(false);
      setPendingUid(uid);
      setMode("pending");
    } catch(e) { setLoading(false); setErr(e.message||"Something went wrong."); }
  };

  const doLogin = async () => {
    setErr("");
    if(!email.trim()) return setErr("Enter your email.");
    if(!password)     return setErr("Enter your password.");
    setLoading(true);
    try {
      const { data:auth,error } = await SUPA.auth.signInWithPassword({ email, password });
      if(error) { setLoading(false); return setErr("Incorrect email or password."); }
      const { data:profile } = await SUPA.from('profiles').select('*').eq('id',auth.user.id).single();
      if(!profile) { setLoading(false); return setErr("Profile not found. Please register."); }
      if(profile.status==='pending') {
        await SUPA.auth.signOut();
        setLoading(false);
        setPendingUid(auth.user.id);
        return setMode("pending");
      }
      onLogin({ name:profile.display_name, pic:profile.avatar_url, id:auth.user.id, email, role:profile.role||'member' });

        <span style={{fontSize:10,fontFamily:MONO,color:"rgba(255,255,255,0.28)",letterSpacing:"0.11em"}}>PROFILE PICTURE</span>
        <span style={{fontSize:9,fontFamily:MONO,padding:"2px 8px",background:preview?"rgba(52,211,153,0.08)":"rgba(251,113,133,0.08)",border:`1px solid ${preview?"rgba(52,211,153,0.2)":"rgba(251,113,133,0.2)"}`,borderRadius:99,color:preview?"rgba(52,211,153,0.7)":"rgba(251,113,133,0.7)"}}>
          {preview?"✓ UPLOADED":"REQUIRED"}
        </span>
      </div>
      <div onClick={()=>fileRef.current.click()} style={{display:"flex",alignItems:"center",gap:16,padding:"14px 16px",background:preview?"rgba(52,211,153,0.04)":"rgba(255,255,255,0.02)",border:`1.5px dashed ${preview?"rgba(52,211,153,0.35)":"rgba(251,113,133,0.25)"}`,borderRadius:14,cursor:"pointer",transition:"all 0.2s"}}
        onMouseEnter={e=>{e.currentTarget.style.background=preview?"rgba(52,211,153,0.07)":"rgba(167,139,250,0.04)";e.currentTarget.style.borderColor=preview?"rgba(52,211,153,0.55)":"rgba(167,139,250,0.35)";}}
        onMouseLeave={e=>{e.currentTarget.style.background=preview?"rgba(52,211,153,0.04)":"rgba(255,255,255,0.02)";e.currentTarget.style.borderColor=preview?"rgba(52,211,153,0.35)":"rgba(251,113,133,0.25)";}}>

        </div>
        <div>
          <div style={{fontSize:13,fontWeight:500,fontFamily:SANS,color:preview?"rgba(52,211,153,0.9)":"rgba(255,255,255,0.5)",marginBottom:2}}>{preview?"Photo uploaded":"Upload your photo"}</div>
          <div style={{fontSize:11,fontFamily:SANS,color:"rgba(255,255,255,0.22)"}}>Shown on the leaderboard · required</div>
        </div>
      </div>
      <input ref={fileRef} type="file" accept="image/*" onChange={handlePic} style={{display:"none"}}/>

    <InputField label="PASSWORD"         value={password} onChange={setPassword} placeholder="Min. 6 characters" type="password" onEnter={doRegister}/>
    <InputField label="CONFIRM PASSWORD" value={confirm}  onChange={setConfirm}  placeholder="Repeat password"  type="password" onEnter={doRegister}/>
    <ErrBox msg={err}/>
    <PBtn onClick={doRegister} disabled={loading}>{loading?<><Spin/> CREATING ACCOUNT...</>:"CREATE ACCOUNT →"}</PBtn>
    <div style={{marginTop:16,textAlign:"center",fontSize:12,fontFamily:SANS,color:"rgba(255,255,255,0.25)"}}>Already registered? <span onClick={()=>reset("login")} style={{color:"rgba(196,181,253,0.6)",cursor:"pointer",fontWeight:500}} onMouseEnter={e=>e.currentTarget.style.color="rgba(196,181,253,0.9)"} onMouseLeave={e=>e.currentTarget.style.color="rgba(196,181,253,0.6)"}>Sign in</span></div>
  </>);

  return wrap(<>
    <Logo/><BackBtn onClick={()=>reset("choose")}/>

    <div style={{fontSize:13,color:"rgba(255,255,255,0.28)",marginBottom:"1.75rem",lineHeight:1.5,animation:"slideUp 0.4s cubic-bezier(0.16,1,0.3,1) 0.1s both"}}>Sign in to your Tickers account.</div>

    <div style={{marginTop:16,textAlign:"center",fontSize:12,fontFamily:SANS,color:"rgba(255,255,255,0.25)"}}>New here? <span onClick={()=>reset("register")} style={{color:"rgba(196,181,253,0.6)",cursor:"pointer",fontWeight:500}} onMouseEnter={e=>e.currentTarget.style.color="rgba(196,181,253,0.9)"} onMouseLeave={e=>e.currentTarget.style.color="rgba(196,181,253,0.6)"}>Create an account</span></div>

});

/* ── SubmitPanel ─────────────────────────────────────────── */
function SubmitPanel({ user, students, onClose, onSubmit }) {
  const [trades,setTrades]     = useState("");
  const [wins,setWins]         = useState("");
  const [pnl,setPnl]           = useState("");
  const [rr,setRr]             = useState("");
  const [hideP,setHideP]       = useState(false);
  const [proofs,setProofs]     = useState([]);
  const [lightbox,setLightbox] = useState(null);
  const [err,setErr]           = useState("");
  const [busy,setBusy]         = useState(false);
  const proofRef = useRef();

  const addProofs = e => {
    [...e.target.files].forEach(f => {
      const r = new FileReader();
      r.onload = ev => setProofs(p => [...p,{file:f,preview:ev.target.result}]);
      r.readAsDataURL(f);
    });
    e.target.value="";
  };
  const removeProof = i => setProofs(p => p.filter((_,idx)=>idx!==i));

  const go = () => {
    setErr("");
    const t=parseInt(trades)||0, w=parseInt(wins)||0;
    if(t<=0)             return setErr("Enter at least 1 trade.");
    if(w>t)              return setErr("Wins can't exceed total trades.");
    if(proofs.length===0) return setErr("At least one trade screenshot is required.");
    setBusy(true);
    onSubmit({ trades:t, wins:w, pnl:parseFloat(pnl)||0, rr:parseFloat(rr)||0, hidePnl:hideP, proofs });
  };

  const pnlNum  = parseFloat(pnl)||0;
  const rrNum   = parseFloat(rr)||0;
  const isProfit = pnlNum>0, isLoss = pnlNum<0;
  const pnlCol   = isProfit?G:isLoss?R:"rgba(255,255,255,0.5)";
  const rrCol    = rrNum>=2?"#a78bfa":rrNum>=1?"#fde68a":"rgba(255,255,255,0.5)";
  const tN=parseInt(trades)||0, wN=parseInt(wins)||0;
  const liveWR   = tN>0?(wN/tN)*100:null;
  const existing = students.find(s=>s.id===user.id);
  const newPnl   = (existing?.pnl||0)+pnlNum;

  return (
    <div style={{position:"fixed",inset:0,zIndex:200,display:"flex",justifyContent:"flex-end",overscrollBehavior:"none"}} onClick={onClose}>
      <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.65)",backdropFilter:"blur(14px)"}}/>
      <div onClick={e=>e.stopPropagation()} className="panel-enter panel-slide" style={{position:"relative",width:440,maxWidth:"100vw",height:"100%",maxHeight:"100vh",background:"#07070f",borderLeft:"1px solid rgba(167,139,250,0.1)",display:"flex",flexDirection:"column",fontFamily:SANS,boxShadow:"-32px 0 100px rgba(0,0,0,0.8)",overflowY:"hidden"}}>
        <div style={{position:"absolute",top:"-60px",right:"-60px",width:"260px",height:"260px",borderRadius:"50%",background:"radial-gradient(circle,rgba(167,139,250,0.11),transparent 65%)",pointerEvents:"none"}}/>
        <div style={{position:"absolute",bottom:"80px",left:"-50px",width:"220px",height:"220px",borderRadius:"50%",background:"radial-gradient(circle,rgba(52,211,153,0.07),transparent 65%)",pointerEvents:"none"}}/>

        {/* HEADER */}
        <div style={{padding:"26px 26px 20px",borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
            <span style={{fontSize:9,fontFamily:MONO,color:"rgba(255,255,255,0.18)",letterSpacing:"0.14em"}}>PERFORMANCE / LOG</span>
            <button onClick={onClose} style={{width:28,height:28,borderRadius:"50%",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.07)",color:"rgba(255,255,255,0.4)",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.15s"}}
              onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,255,255,0.09)";e.currentTarget.style.color="#fff";}} onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,255,255,0.04)";e.currentTarget.style.color="rgba(255,255,255,0.4)";}}>✕</button>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:13,padding:"13px 15px",background:"rgba(167,139,250,0.04)",border:"1px solid rgba(167,139,250,0.1)",borderRadius:14}}>
            <Avatar name={user.name} pic={user.pic} size={46}/>
            <div>
              <div style={{fontSize:18,fontWeight:600,color:"#fff",letterSpacing:"-0.025em",fontFamily:SANS}}>{user.name}</div>
              <div style={{fontSize:11,fontFamily:MONO,color:"rgba(167,139,250,0.5)",letterSpacing:"0.05em",marginTop:2}}>logging today's session</div>
            </div>
            {pnlNum!==0&&<div style={{marginLeft:"auto",textAlign:"right"}}>
              <div style={{fontSize:9,fontFamily:MONO,color:"rgba(255,255,255,0.2)",letterSpacing:"0.08em",marginBottom:3}}>NEW TOTAL</div>
              <div style={{fontSize:15,fontFamily:MONO,fontWeight:700,color:newPnl>=0?G:R,textShadow:`0 0 12px ${newPnl>=0?G:R}66`}}>{fmt(newPnl)}</div>
            </div>}
          </div>
        </div>

        {/* BODY */}
        <div className="panel-body" style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"28px 26px 80px",overscrollBehavior:"contain"}}>
          {/* P&L */}
          <div style={{marginBottom:22}}>
            <div style={{fontSize:10,fontFamily:MONO,letterSpacing:"0.13em",color:"rgba(255,255,255,0.25)",marginBottom:10}}>TODAY'S P&L</div>
            <div style={{position:"relative"}}>
              <span style={{position:"absolute",left:18,top:"50%",transform:"translateY(-50%)",fontSize:20,fontWeight:700,fontFamily:MONO,color:pnlNum!==0?pnlCol+"88":"rgba(255,255,255,0.18)",transition:"color 0.3s",pointerEvents:"none"}}>$</span>
              <input type="text" inputMode="text" value={pnl}
                onChange={e=>{const v=e.target.value.replace(/[^0-9.\-]/g,"");if((v.match(/\./g)||[]).length<=1&&(v.match(/\-/g)||[]).length<=1&&(v==="-"||v===""||!isNaN(Number(v))||v.endsWith(".")))setPnl(v);}}
                placeholder="0"
                style={{width:"100%",padding:"20px 20px 20px 40px",background:isProfit?"rgba(52,211,153,0.05)":isLoss?"rgba(251,113,133,0.05)":"rgba(255,255,255,0.03)",border:`1px solid ${isProfit?"rgba(52,211,153,0.25)":isLoss?"rgba(251,113,133,0.25)":"rgba(255,255,255,0.08)"}`,borderRadius:14,color:pnlNum!==0?pnlCol:"rgba(255,255,255,0.55)",fontSize:28,fontFamily:MONO,fontWeight:700,outline:"none",textShadow:pnlNum!==0?`0 0 20px ${pnlCol}66`:"none",boxShadow:isProfit?"0 0 30px rgba(52,211,153,0.08)":isLoss?"0 0 30px rgba(251,113,133,0.08)":"none",transition:"all 0.25s"}}
                onFocus={e=>{e.target.style.borderColor=isProfit?"rgba(52,211,153,0.5)":isLoss?"rgba(251,113,133,0.5)":"rgba(167,139,250,0.4)";}}
                onBlur={e=>{e.target.style.borderColor=isProfit?"rgba(52,211,153,0.25)":isLoss?"rgba(251,113,133,0.25)":"rgba(255,255,255,0.08)";}}/>
            </div>
            {pnlNum!==0&&<div style={{marginTop:7,fontSize:12,fontFamily:MONO,fontWeight:600,color:pnlCol,textShadow:`0 0 12px ${pnlCol}88`,letterSpacing:"0.04em"}}>{isProfit?"▲ PROFIT DAY":"▼ LOSS DAY"} · {fmt(pnlNum)}</div>}
          </div>

          {/* TRADES + WINS */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            {[{label:"TRADES",val:trades,set:setTrades,hint:"total",ac:"rgba(255,255,255,0.45)"},{label:"WINS",val:wins,set:setWins,hint:"winning",ac:"rgba(52,211,153,0.65)"}].map(f=>(
              <div key={f.label}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                  <span style={{fontSize:10,fontFamily:MONO,letterSpacing:"0.12em",color:f.ac}}>{f.label}</span>
                  <span style={{fontSize:10,color:"rgba(255,255,255,0.18)",fontFamily:SANS}}>{f.hint}</span>
                </div>
                <input type="number" value={f.val} onChange={e=>f.set(e.target.value)} placeholder="0"
                  style={{width:"100%",padding:"13px 14px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:12,color:"rgba(255,255,255,0.9)",fontSize:20,fontFamily:MONO,fontWeight:700,outline:"none",transition:"all 0.2s"}}
                  onFocus={e=>{e.target.style.border="1px solid rgba(167,139,250,0.4)";e.target.style.background="rgba(167,139,250,0.04)";}} onBlur={e=>{e.target.style.border="1px solid rgba(255,255,255,0.07)";e.target.style.background="rgba(255,255,255,0.03)";}}/>
              </div>
            ))}
          </div>

          {liveWR!==null&&tN>0&&wN>=0&&wN<=tN&&<div style={{marginBottom:18,padding:"12px 16px",background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:12,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <span style={{fontSize:11,fontFamily:MONO,color:"rgba(255,255,255,0.28)",letterSpacing:"0.08em"}}>WIN RATE PREVIEW</span>
            <span style={{fontSize:16,fontFamily:MONO,fontWeight:700,color:liveWR>=60?G:liveWR>=40?"#fde68a":R,textShadow:`0 0 14px ${liveWR>=60?G:liveWR>=40?"#fde68a":R}99`}}>{pct(liveWR)}</span>
          </div>}

          {/* RR MADE */}
          <div style={{marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
              <span style={{fontSize:10,fontFamily:MONO,letterSpacing:"0.12em",color:"rgba(167,139,250,0.7)"}}>RR MADE</span>
              <span style={{fontSize:10,color:"rgba(255,255,255,0.18)",fontFamily:SANS}}>e.g. 2.5</span>
            </div>
            <input type="text" inputMode="decimal" value={rr}
              onChange={e=>{const v=e.target.value.replace(/[^0-9.]/g,"");if((v.match(/\./g)||[]).length<=1)setRr(v);}}
              placeholder="0"
              style={{width:"100%",padding:"13px 14px",
                background:rrNum>=2?"rgba(167,139,250,0.08)":rrNum>0?"rgba(167,139,250,0.04)":"rgba(255,255,255,0.03)",
                border:`1px solid ${rrNum>=2?"rgba(167,139,250,0.5)":rrNum>0?"rgba(167,139,250,0.25)":"rgba(255,255,255,0.07)"}`,
                borderRadius:12,
                color:rrNum>0?"rgba(196,181,253,0.95)":"rgba(255,255,255,0.55)",
                fontSize:20,fontFamily:MONO,fontWeight:700,outline:"none",
                textShadow:rrNum>=2?"0 0 16px rgba(167,139,250,0.8)":rrNum>0?"0 0 10px rgba(167,139,250,0.4)":"none",
                boxShadow:rrNum>=2?"0 0 20px rgba(167,139,250,0.15),inset 0 0 20px rgba(167,139,250,0.04)":rrNum>0?"0 0 10px rgba(167,139,250,0.08)":"none",
                transition:"all 0.2s"}}
              onFocus={e=>{e.target.style.border="1px solid rgba(167,139,250,0.5)";e.target.style.background="rgba(167,139,250,0.06)";e.target.style.boxShadow="0 0 24px rgba(167,139,250,0.15)";}}
              onBlur={e=>{e.target.style.border=rrNum>=2?"1px solid rgba(167,139,250,0.5)":rrNum>0?"1px solid rgba(167,139,250,0.25)":"1px solid rgba(255,255,255,0.07)";e.target.style.background=rrNum>=2?"rgba(167,139,250,0.08)":rrNum>0?"rgba(167,139,250,0.04)":"rgba(255,255,255,0.03)";e.target.style.boxShadow=rrNum>=2?"0 0 20px rgba(167,139,250,0.15)":rrNum>0?"0 0 10px rgba(167,139,250,0.08)":"none";}}/>
            {rrNum>0&&<div style={{marginTop:5,fontSize:11,fontFamily:MONO,fontWeight:600,color:"rgba(167,139,250,0.7)",letterSpacing:"0.04em",textShadow:"0 0 8px rgba(167,139,250,0.4)"}}>
              {rrNum>=3?"🔥 EXCEPTIONAL":rrNum>=2?"✨ GREAT":rrNum>=1?"👍 DECENT":"⚠️ LOW"} · {rrNum}R
            </div>}
          </div>

          {err&&<div style={{marginBottom:16,padding:"10px 14px",background:"rgba(251,113,133,0.07)",border:"1px solid rgba(251,113,133,0.18)",borderRadius:10,color:"rgba(251,113,133,0.9)",fontSize:12,fontFamily:MONO}}>{err}</div>}

          {/* SCREENSHOTS */}
          <div style={{marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <span style={{fontSize:10,fontFamily:MONO,letterSpacing:"0.12em",color:"rgba(255,255,255,0.3)"}}>TRADE SCREENSHOTS</span>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                {proofs.length>0&&<span style={{fontSize:9,fontFamily:MONO,color:"rgba(52,211,153,0.7)",letterSpacing:"0.06em"}}>{proofs.length} UPLOADED</span>}
                <span style={{fontSize:9,fontFamily:MONO,letterSpacing:"0.08em",padding:"2px 8px",background:proofs.length>0?"rgba(52,211,153,0.08)":"rgba(251,113,133,0.08)",border:`1px solid ${proofs.length>0?"rgba(52,211,153,0.2)":"rgba(251,113,133,0.2)"}`,borderRadius:99,color:proofs.length>0?"rgba(52,211,153,0.7)":"rgba(251,113,133,0.7)"}}>
                  {proofs.length>0?"✓ DONE":"REQUIRED"}
                </span>
              </div>
            </div>
            <input ref={proofRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={addProofs}/>
            {proofs.length>0&&(
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:8}}>
                {proofs.map((p,i)=>(
                  <div key={i} style={{position:"relative",borderRadius:10,overflow:"hidden",aspectRatio:"1",border:"1px solid rgba(52,211,153,0.2)",cursor:"pointer"}} onClick={()=>setLightbox(p.preview)}>

                </div>
              </div>

            {proofs.length===0&&(
              <div onClick={()=>proofRef.current.click()} style={{borderRadius:14,cursor:"pointer",border:"1.5px dashed rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.02)",transition:"all 0.25s"}}

/* ── PnL Logs ────────────────────────────────────────────── */
function PnlLogs({ user, sessions, onDeleteSession }) {
  const mine = sessions.filter(s=>s.user_id===user.id);
  const totPnl    = mine.reduce((a,s)=>a+s.pnl,0);
  const totTrades = mine.reduce((a,s)=>a+s.trades,0);
  const totWins   = mine.reduce((a,s)=>a+s.wins,0);
  const [lb,setLb]=useState(null);
  const [confirmId,setConfirmId]=useState(null);
  const [deleting,setDeleting]=useState(false);

  const doDeleteSession = async () => {
    setDeleting(true);
    await onDeleteSession(confirmId);
    setDeleting(false);
    setConfirmId(null);
  };

  return (
    <div style={{padding:"44px 32px",maxWidth:860,margin:"0 auto",animation:"fadeIn 0.4s ease"}}>
      <div style={{marginBottom:"2rem"}}>
        <h1 style={{margin:0,fontSize:42,fontWeight:700,fontFamily:SANS,letterSpacing:"-0.035em",color:"rgba(255,255,255,0.93)"}}>PnL Logs</h1>
        <p style={{margin:"8px 0 0",fontSize:11,fontFamily:MONO,color:"rgba(255,255,255,0.22)",letterSpacing:"0.08em"}}>YOUR SUBMITTED TRADING HISTORY</p>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:28}}>
        {[{l:"TOTAL P&L",v:fmt(totPnl),c:totPnl>=0?G:R,glow:totPnl>=0?G:R},{l:"TOTAL TRADES",v:String(totTrades),c:"rgba(255,255,255,0.85)"},{l:"WIN RATE",v:totTrades>0?pct((totWins/totTrades)*100):"—",c:totTrades>0&&(totWins/totTrades)>=0.6?"#86efac":totTrades>0&&(totWins/totTrades)>=0.4?"#fde68a":R}].map(c=>(
          <div key={c.l} style={{background:"rgba(255,255,255,0.025)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:16,padding:"18px 20px"}}>
            <div style={{fontSize:9,fontFamily:MONO,color:"rgba(255,255,255,0.28)",letterSpacing:"0.12em",marginBottom:8}}>{c.l}</div>
            <div style={{fontSize:26,fontWeight:700,fontFamily:MONO,color:c.c,textShadow:c.glow?`0 0 16px ${c.glow}55`:"none"}}>{c.v}</div>
          </div>
        ))}
      </div>
      {mine.length===0
        ?<div style={{textAlign:"center",padding:"72px 32px",border:"1px solid rgba(255,255,255,0.05)",borderRadius:18,background:"rgba(255,255,255,0.01)"}}>
          <div style={{fontSize:32,marginBottom:12}}>📋</div>
          <div style={{fontFamily:MONO,fontSize:12,color:"rgba(255,255,255,0.2)",letterSpacing:"0.1em"}}>NO SESSIONS YET</div>
          <div style={{fontFamily:SANS,fontSize:13,color:"rgba(255,255,255,0.18)",marginTop:6}}>Submit your first P&L to see it here</div>
        </div>
        :<div style={{display:"flex",flexDirection:"column",gap:12}}>
          {[...mine].reverse().map((s,i)=>{
            const isWin=s.pnl>=0; const wr=s.trades>0?(s.wins/s.trades)*100:0;
            return (
              <div key={s.id||i} style={{border:`1px solid ${isWin?"rgba(52,211,153,0.12)":"rgba(251,113,133,0.1)"}`,borderRadius:16,background:"rgba(255,255,255,0.02)",overflow:"hidden"}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr auto auto auto auto",gap:16,alignItems:"center",padding:"16px 20px",borderBottom:s.proof_urls?.length?"1px solid rgba(255,255,255,0.04)":"none"}}>
                  <div>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                      <div style={{width:6,height:6,borderRadius:"50%",background:isWin?G:R,boxShadow:`0 0 6px ${isWin?G:R}`}}/>
                      <span style={{fontFamily:MONO,fontSize:10,color:"rgba(255,255,255,0.3)",letterSpacing:"0.08em"}}>{s.date}</span>
                      {s.hide_pnl&&<span style={{fontSize:9,fontFamily:MONO,color:"rgba(167,139,250,0.45)",padding:"1px 6px",border:"1px solid rgba(167,139,250,0.15)",borderRadius:99}}>PRIVATE</span>}
                    </div>
                    <div style={{fontFamily:MONO,fontSize:22,fontWeight:700,color:isWin?G:R,textShadow:`0 0 14px ${isWin?G:R}55`}}>{s.hide_pnl?"——":fmt(s.pnl)}</div>
                  </div>
                  {[{l:"TRADES",v:s.trades,c:"rgba(255,255,255,0.75)"},{l:"WINS",v:s.wins,c:G},{l:"WIN %",v:pct(wr),c:wr>=60?"#86efac":wr>=40?"#fde68a":R}].map(x=>(
                    <div key={x.l} style={{textAlign:"center"}}>
                      <div style={{fontSize:9,fontFamily:MONO,color:"rgba(255,255,255,0.2)",letterSpacing:"0.1em",marginBottom:4}}>{x.l}</div>
                      <div style={{fontSize:18,fontFamily:MONO,fontWeight:700,color:x.c}}>{x.v}</div>

                  ))}
                  <button onClick={()=>setConfirmId(s.id)} title="Delete this log" style={{width:30,height:30,borderRadius:8,background:"rgba(255,60,60,0.06)",border:"1px solid rgba(255,60,60,0.12)",color:"rgba(255,100,100,0.5)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all 0.2s"}}
                    onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,60,60,0.15)";e.currentTarget.style.borderColor="rgba(255,60,60,0.35)";e.currentTarget.style.color="rgba(255,100,100,1)";}} onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,60,60,0.06)";e.currentTarget.style.borderColor="rgba(255,60,60,0.12)";e.currentTarget.style.color="rgba(255,100,100,0.5)";}}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><polyline points="3,6 5,6 21,6" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><path d="M10 11v6M14 11v6" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
                  </button>
                </div>
                {s.proof_urls?.length>0&&<div style={{padding:"12px 20px",display:"flex",gap:8,flexWrap:"wrap"}}>
                  {s.proof_urls.map((src,j)=>(
                    <img key={j} src={src} onClick={()=>setLb(src)} style={{width:64,height:64,objectFit:"cover",borderRadius:8,cursor:"pointer",border:"1px solid rgba(255,255,255,0.08)",transition:"all 0.2s"}}
                      onMouseEnter={e=>{e.currentTarget.style.border="1px solid rgba(167,139,250,0.4)";e.currentTarget.style.transform="scale(1.05)";}} onMouseLeave={e=>{e.currentTarget.style.border="1px solid rgba(255,255,255,0.08)";e.currentTarget.style.transform="scale(1)";}}/>
                  ))}
                </div>}
              </div>
            );
          })}
        </div>
      }
      {lb&&<div onClick={()=>setLb(null)} style={{position:"fixed",inset:0,zIndex:999,background:"rgba(0,0,0,0.88)",backdropFilter:"blur(10px)",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <img src={lb} style={{maxWidth:"90vw",maxHeight:"90vh",borderRadius:14,boxShadow:"0 0 60px rgba(0,0,0,0.8)"}} onClick={e=>e.stopPropagation()}/>
        <button onClick={()=>setLb(null)} style={{position:"fixed",top:20,right:24,background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:"50%",width:36,height:36,color:"#fff",fontSize:16,cursor:"pointer"}}>✕</button>
      </div>}

      {/* Delete session confirm */}
      {confirmId&&<div style={{position:"fixed",inset:0,zIndex:9999,background:"rgba(0,0,0,0.8)",backdropFilter:"blur(16px)",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}} onClick={()=>!deleting&&setConfirmId(null)}>
        <div onClick={e=>e.stopPropagation()} style={{position:"relative",background:"linear-gradient(135deg,rgba(14,14,28,0.98),rgba(10,10,20,0.98))",border:"1px solid rgba(255,60,60,0.2)",borderRadius:24,padding:"32px",width:380,maxWidth:"92vw",boxShadow:"0 0 60px rgba(255,60,60,0.12),0 0 120px rgba(255,60,60,0.06),0 40px 80px rgba(0,0,0,0.7)",animation:"fadeIn 0.25s ease",overflow:"hidden",textAlign:"center"}}>
          <div style={{position:"absolute",top:"-40px",right:"-40px",width:"140px",height:"140px",borderRadius:"50%",background:"radial-gradient(circle,rgba(255,60,60,0.15),transparent 65%)",pointerEvents:"none"}}/>
          <div style={{position:"absolute",bottom:"-30px",left:"-30px",width:"110px",height:"110px",borderRadius:"50%",background:"radial-gradient(circle,rgba(255,60,60,0.08),transparent 65%)",pointerEvents:"none"}}/>
          <div style={{width:50,height:50,borderRadius:14,background:"rgba(255,60,60,0.1)",border:"1px solid rgba(255,60,60,0.22)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 18px",boxShadow:"0 0 20px rgba(255,60,60,0.18)"}}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><polyline points="3,6 5,6 21,6" stroke="rgba(255,100,100,0.9)" strokeWidth="2" strokeLinecap="round"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" stroke="rgba(255,100,100,0.9)" strokeWidth="2" strokeLinecap="round"/><path d="M10 11v6M14 11v6" stroke="rgba(255,100,100,0.9)" strokeWidth="2" strokeLinecap="round"/></svg>
          </div>
          <div style={{fontSize:20,fontWeight:700,fontFamily:SANS,color:"#fff",marginBottom:9,letterSpacing:"-0.025em"}}>Delete this log?</div>
          <div style={{fontSize:13,fontFamily:SANS,color:"rgba(255,255,255,0.38)",marginBottom:26,lineHeight:1.7}}>This session will be removed and your leaderboard stats will be recalculated automatically.</div>

            <button onClick={()=>setConfirmId(null)} disabled={deleting} style={{flex:1,padding:"12px",borderRadius:12,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.09)",color:"rgba(255,255,255,0.55)",fontFamily:MONO,fontSize:12,fontWeight:700,cursor:"pointer",transition:"all 0.2s"}}
              onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,255,255,0.08)";e.currentTarget.style.color="#fff";}} onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,255,255,0.04)";e.currentTarget.style.color="rgba(255,255,255,0.55)";}}>CANCEL</button>
            <button onClick={doDeleteSession} disabled={deleting} style={{flex:1,padding:"12px",borderRadius:12,background:"rgba(255,60,60,0.15)",border:"1px solid rgba(255,60,60,0.35)",color:"rgba(255,110,110,0.95)",fontFamily:MONO,fontSize:12,fontWeight:700,cursor:deleting?"not-allowed":"pointer",opacity:deleting?0.7:1,display:"flex",alignItems:"center",justifyContent:"center",gap:7,transition:"all 0.2s",boxShadow:"0 0 20px rgba(255,60,60,0.15)"}}

/* ── AdminPanel ──────────────────────────────────────────── */
function AdminPanel({ students, sessions, onDeleteSession, onDeleteTrader }) {
  const [expandedUser, setExpandedUser] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [confirmDelTrader, setConfirmDelTrader] = useState(null);
  const [busy, setBusy] = useState(false);
  const [pending, setPending] = useState([]);
  const [approvingId, setApprovingId] = useState(null);

  useEffect(()=>{
    fetchPending();
  },[]);

  const fetchPending = async () => {
    const {data} = await SUPA.from('profiles').select('*').eq('status','pending');
    setPending(data||[]);
  };

  const approveUser = async (profile) => {
    setApprovingId(profile.id);
    try {
      // Create trader row FIRST so it exists when user polls for approval
      const {data:existing} = await SUPA.from('traders').select('id').eq('id',profile.id).maybeSingle();
      if(!existing) {
        const {error} = await SUPA.from('traders').insert({
          id:           profile.id,
          username:     profile.username,
          display_name: profile.display_name,
          avatar_url:   profile.avatar_url,
          pnl:0, trades:0, wins:0,
          hide_pnl:false,
          role:'member',
          rr_made:0
        });
        if(error) console.error('Trader insert error:',error);
      }
      // THEN update status — this is what the poll detects
      await SUPA.from('profiles').update({status:'approved'}).eq('id',profile.id);
      setPending(p=>p.filter(x=>x.id!==profile.id));
    } catch(e) { console.error('Approve error:',e); }
    setApprovingId(null);
  };

  const rejectUser = async (profile) => {
    setApprovingId(profile.id);
    try {
      await SUPA.from('profiles').delete().eq('id',profile.id);
      setPending(p=>p.filter(x=>x.id!==profile.id));
    } catch(e) { console.error(e); }
    setApprovingId(null);
  };

  return (
    <div style={{padding:"24px 32px 40px",maxWidth:1200,margin:"0 auto",animation:"fadeIn 0.4s ease"}}>
      {/* Header */}
      <div style={{marginBottom:"1.5rem",display:"flex",alignItems:"center",gap:14}}>
        <div style={{width:44,height:44,borderRadius:13,background:"linear-gradient(135deg,rgba(139,92,246,0.2),rgba(99,102,241,0.12))",border:"1px solid rgba(139,92,246,0.35)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 0 24px rgba(139,92,246,0.25)"}}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="rgba(196,181,253,0.9)" strokeWidth="2" strokeLinejoin="round"/></svg>
        </div>
        <div>
          <h1 style={{margin:0,fontSize:32,fontWeight:800,fontFamily:SANS,letterSpacing:"-0.04em",color:"#fff"}}>Admin Panel</h1>
          <p style={{margin:"3px 0 0",fontSize:10,fontFamily:MONO,color:"rgba(255,255,255,0.2)",letterSpacing:"0.1em"}}>FULL ACCESS · {students.length} TRADERS · {sessions.length} SESSIONS</p>
        </div>
      </div>

      {/* Pending Approvals */}
      {pending.length>0&&<div style={{marginBottom:20,border:"1px solid rgba(253,230,138,0.2)",borderRadius:16,overflow:"hidden",background:"rgba(253,230,138,0.02)"}}>
        <div style={{padding:"13px 20px",borderBottom:"1px solid rgba(253,230,138,0.1)",display:"flex",alignItems:"center",gap:8}}>
          <span style={{width:7,height:7,borderRadius:"50%",background:"rgba(253,230,138,0.9)",boxShadow:"0 0 8px rgba(253,230,138,0.6)",display:"inline-block",animation:"pulseGlow 1.5s ease-in-out infinite"}}/>
          <span style={{fontFamily:MONO,fontSize:11,fontWeight:700,color:"rgba(253,230,138,0.9)",letterSpacing:"0.08em"}}>PENDING APPROVALS — {pending.length}</span>
        </div>
        {pending.map(p=>(
          <div key={p.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"13px 20px",borderBottom:"1px solid rgba(253,230,138,0.05)",flexWrap:"wrap",gap:10}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <Avatar name={p.display_name} pic={p.avatar_url} size={36}/>
              <div>
                <div style={{fontSize:14,fontWeight:700,fontFamily:SANS,color:"#fff"}}>{p.display_name}</div>
                <div style={{fontSize:10,fontFamily:MONO,color:"rgba(255,255,255,0.3)",marginTop:2}}>{p.email}</div>
              </div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>approveUser(p)} disabled={approvingId===p.id}
                style={{padding:"7px 14px",borderRadius:9,background:"rgba(52,211,153,0.1)",border:"1px solid rgba(52,211,153,0.3)",color:"rgba(52,211,153,0.9)",fontFamily:MONO,fontSize:11,fontWeight:700,cursor:"pointer",transition:"all 0.2s"}}
                onMouseEnter={e=>{e.currentTarget.style.background="rgba(52,211,153,0.2)";}} onMouseLeave={e=>{e.currentTarget.style.background="rgba(52,211,153,0.1)";}}>
                {approvingId===p.id?"APPROVING...":"✓ APPROVE"}
              </button>
              <button onClick={()=>rejectUser(p)} disabled={approvingId===p.id}
                style={{padding:"7px 14px",borderRadius:9,background:"rgba(255,60,60,0.06)",border:"1px solid rgba(255,60,60,0.2)",color:"rgba(255,100,100,0.7)",fontFamily:MONO,fontSize:11,fontWeight:700,cursor:"pointer",transition:"all 0.2s"}}
                onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,60,60,0.14)";}} onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,60,60,0.06)";}}>
                ✕ REJECT
              </button>
            </div>
          </div>
        ))}
      </div>}

      {/* Traders list */}
      {students.map(trader=>{
        const traderSessions = sessions.filter(s=>s.user_id===trader.id);
        const isExpanded = expandedUser===trader.id;
        return (
          <div key={trader.id} style={{marginBottom:12,border:`1px solid ${isExpanded?"rgba(139,92,246,0.25)":"rgba(255,255,255,0.06)"}`,borderRadius:16,overflow:"hidden",background:"rgba(10,8,22,0.9)",transition:"border-color 0.2s"}}>
            {/* Trader header row */}
            <div onClick={()=>setExpandedUser(isExpanded?null:trader.id)}
              style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 20px",cursor:"pointer",background:isExpanded?"rgba(139,92,246,0.06)":"transparent",transition:"background 0.2s"}}>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                <Avatar name={trader.name} pic={trader.pic} size={38}/>
                <div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:15,fontWeight:700,fontFamily:SANS,color:"#fff",letterSpacing:"-0.02em"}}>{trader.name}</span>
                    {trader.role==="admin"&&<span style={{fontSize:9,fontFamily:MONO,fontWeight:700,padding:"2px 7px",background:"linear-gradient(135deg,rgba(139,92,246,0.25),rgba(99,102,241,0.15))",border:"1px solid rgba(139,92,246,0.45)",borderRadius:99,color:"rgba(196,181,253,0.95)",boxShadow:"0 0 10px rgba(139,92,246,0.3)"}}>ADMIN</span>}
                  </div>
                  <div style={{fontSize:10,fontFamily:MONO,color:"rgba(255,255,255,0.3)",marginTop:2}}>{traderSessions.length} session{traderSessions.length!==1?"s":""} · Total P&L: <span style={{color:trader.pnl>=0?"#34d399":"#fb7185",fontWeight:600}}>{fmt(trader.pnl)}</span></div>
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <button onClick={e=>{e.stopPropagation();setConfirmDelTrader(trader);}}
                  style={{padding:"6px 12px",borderRadius:8,background:"rgba(255,50,50,0.06)",border:"1px solid rgba(255,50,50,0.15)",color:"rgba(255,100,100,0.7)",fontFamily:MONO,fontSize:10,fontWeight:700,cursor:"pointer",transition:"all 0.2s"}}
                  onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,50,50,0.14)";e.currentTarget.style.color="rgba(255,100,100,1)";}}
                  onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,50,50,0.06)";e.currentTarget.style.color="rgba(255,100,100,0.7)";}}>
                  DELETE USER
                </button>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style={{transform:isExpanded?"rotate(180deg)":"rotate(0deg)",transition:"transform 0.2s",flexShrink:0}}><path d="M6 9l6 6 6-6" stroke="rgba(255,255,255,0.3)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </div>
            </div>

            {/* Sessions */}
            {isExpanded&&<div style={{borderTop:"1px solid rgba(255,255,255,0.05)",padding:"12px 20px",display:"flex",flexDirection:"column",gap:10}}>
              {traderSessions.length===0
                ?<div style={{textAlign:"center",padding:"24px",fontFamily:MONO,fontSize:11,color:"rgba(255,255,255,0.15)"}}>NO SESSIONS YET</div>
                :traderSessions.map(s=>{
                  const isWin=s.pnl>=0; const wr=s.trades>0?(s.wins/s.trades)*100:0;
                  return (
                    <div key={s.id} style={{background:"rgba(255,255,255,0.02)",border:`1px solid ${isWin?"rgba(52,211,153,0.1)":"rgba(251,113,133,0.08)"}`,borderRadius:12,overflow:"hidden"}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",flexWrap:"wrap",gap:8}}>
                        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                          <div style={{width:6,height:6,borderRadius:"50%",background:isWin?"#34d399":"#fb7185",boxShadow:`0 0 6px ${isWin?"#34d399":"#fb7185"}`,flexShrink:0}}/>
                          <span style={{fontFamily:MONO,fontSize:10,color:"rgba(255,255,255,0.3)"}}>{s.date}</span>
                          {s.hide_pnl&&<span style={{fontSize:9,fontFamily:MONO,color:"rgba(139,92,246,0.5)",padding:"1px 6px",border:"1px solid rgba(139,92,246,0.15)",borderRadius:99}}>PRIVATE</span>}
                          <span style={{fontFamily:MONO,fontSize:16,fontWeight:700,color:isWin?"#34d399":"#fb7185",textShadow:`0 0 12px ${isWin?"#34d39955":"#fb718555"}`}}>{fmt(s.pnl)}</span>
                          <span style={{fontFamily:MONO,fontSize:11,color:"rgba(255,255,255,0.4)"}}>{s.trades} trades · {s.wins} wins · {wr.toFixed(0)}%</span>
                        </div>
                        <button onClick={()=>setConfirmDel({sessionId:s.id,userId:s.user_id})}
                          style={{padding:"5px 10px",borderRadius:7,background:"rgba(255,50,50,0.06)",border:"1px solid rgba(255,50,50,0.15)",color:"rgba(255,100,100,0.65)",fontFamily:MONO,fontSize:10,fontWeight:700,cursor:"pointer",transition:"all 0.2s",flexShrink:0}}
                          onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,50,50,0.14)";e.currentTarget.style.color="rgba(255,100,100,1)";}}
                          onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,50,50,0.06)";e.currentTarget.style.color="rgba(255,100,100,0.65)";}}>
                          DELETE
                        </button>
                      </div>
                      {/* Proof screenshots */}
                      {s.proof_urls?.length>0&&<div style={{padding:"0 16px 12px",display:"flex",gap:8,flexWrap:"wrap"}}>
                        {s.proof_urls.map((src,j)=>(
                          <img key={j} src={src} onClick={()=>setLightbox(src)}
                            style={{width:80,height:80,objectFit:"cover",borderRadius:8,cursor:"pointer",border:"1px solid rgba(255,255,255,0.08)",transition:"all 0.2s"}}
                            onMouseEnter={e=>{e.currentTarget.style.border="1px solid rgba(139,92,246,0.5)";e.currentTarget.style.transform="scale(1.05)";}}
                            onMouseLeave={e=>{e.currentTarget.style.border="1px solid rgba(255,255,255,0.08)";e.currentTarget.style.transform="scale(1)";}}/>
                        ))}
                      </div>}
                    </div>
                  );
                })}
            </div>}
          </div>
        );
      })}

      {/* Lightbox */}
      {lightbox&&<div onClick={()=>setLightbox(null)} style={{position:"fixed",inset:0,zIndex:9999,background:"rgba(0,0,0,0.92)",backdropFilter:"blur(12px)",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <img src={lightbox} style={{maxWidth:"92vw",maxHeight:"90vh",borderRadius:12,boxShadow:"0 0 80px rgba(0,0,0,0.8)"}} onClick={e=>e.stopPropagation()}/>
        <button onClick={()=>setLightbox(null)} style={{position:"fixed",top:20,right:24,background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:"50%",width:38,height:38,color:"#fff",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
      </div>}

      {/* Delete session confirm */}
      {confirmDel&&<div style={{position:"fixed",inset:0,zIndex:9999,background:"rgba(0,0,0,0.8)",backdropFilter:"blur(16px)",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}} onClick={()=>!busy&&setConfirmDel(null)}>
        <div onClick={e=>e.stopPropagation()} className="modal-enter" style={{position:"relative",background:"linear-gradient(145deg,rgba(13,10,26,0.99),rgba(8,8,18,0.99))",border:"1px solid rgba(255,60,60,0.2)",borderRadius:24,padding:"32px",width:380,maxWidth:"92vw",textAlign:"center",overflow:"hidden",boxShadow:"0 0 60px rgba(255,60,60,0.12),0 40px 80px rgba(0,0,0,0.7)"}}>
          <div style={{position:"absolute",top:"-40px",right:"-40px",width:"140px",height:"140px",borderRadius:"50%",background:"radial-gradient(circle,rgba(255,60,60,0.15),transparent 65%)",pointerEvents:"none"}}/>

          <div style={{fontSize:13,fontFamily:SANS,color:"rgba(255,255,255,0.35)",marginBottom:24,lineHeight:1.6}}>This will permanently remove the session and recalculate the trader's stats.</div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setConfirmDel(null)} style={{flex:1,padding:"12px",borderRadius:11,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",color:"rgba(255,255,255,0.5)",fontFamily:MONO,fontSize:12,fontWeight:700,cursor:"pointer"}}>CANCEL</button>
            <button onClick={async()=>{setBusy(true);await onDeleteSession(confirmDel.sessionId,confirmDel.userId);setBusy(false);setConfirmDel(null);}} disabled={busy}
              style={{flex:1,padding:"12px",borderRadius:11,background:"rgba(255,60,60,0.15)",border:"1px solid rgba(255,60,60,0.35)",color:"rgba(255,110,110,0.95)",fontFamily:MONO,fontSize:12,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              {busy?<><Spin/>DELETING...</>:"DELETE"}
            </button>
          </div>
        </div>
      </div>}

      {/* Delete trader confirm */}
      {confirmDelTrader&&<div style={{position:"fixed",inset:0,zIndex:9999,background:"rgba(0,0,0,0.8)",backdropFilter:"blur(16px)",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}} onClick={()=>!busy&&setConfirmDelTrader(null)}>

          <div style={{fontSize:13,fontFamily:SANS,color:"rgba(255,255,255,0.35)",marginBottom:24,lineHeight:1.6}}>This will delete their account, all sessions, and remove them from the leaderboard. <span style={{color:"rgba(255,100,100,0.8)",fontWeight:600}}>Cannot be undone.</span></div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setConfirmDelTrader(null)} style={{flex:1,padding:"12px",borderRadius:11,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",color:"rgba(255,255,255,0.5)",fontFamily:MONO,fontSize:12,fontWeight:700,cursor:"pointer"}}>CANCEL</button>

              {busy?<><Spin/>DELETING...</>:"YES, DELETE USER"}
            </button>
          </div>
        </div>
      </div>}
    </div>
  );
}

        setLastSync(new Date());
      }
    } catch(e) { console.log('Leaderboard fetch error:', e); }

    } catch(e) { console.log('Sessions fetch error:', e); }
  };

    fetchSessions();

    /* ── Supabase Realtime — instant updates, no polling needed ── */
    const ch = SUPA.channel('traders-realtime')
      .on('postgres_changes', { event:'*', schema:'public', table:'traders' }, () => {
        fetchLeaderboard();
      })
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'sessions' }, () => {
        fetchSessions();
      })
      .subscribe();

    return()=>{ SUPA.removeChannel(ch); };
  },[]);

  const filteredStudents = useMemo(()=>{
    if(timeFilter==="all") return students;
    const now = new Date();
    const cutoff = new Date();
    if(timeFilter==="today") cutoff.setHours(0,0,0,0);
    else if(timeFilter==="week") cutoff.setDate(now.getDate()-7);
    else if(timeFilter==="month") cutoff.setDate(now.getDate()-30);
    const filtered = sessions.filter(s=>new Date(s.submitted_at)>=cutoff);
    // Always show all traders — just show their period stats (0 if no activity)
    return students.map(trader=>{
      const ts = filtered.filter(s=>s.user_id===trader.id);
      const pnl   = ts.reduce((a,s)=>a+(s.pnl||0),0);
      const trades= ts.reduce((a,s)=>a+(s.trades||0),0);
      const wins  = ts.reduce((a,s)=>a+(s.wins||0),0);
      const rrSessions = ts.filter(s=>s.rr>0);
      const rrMade = rrSessions.length>0 ? rrSessions.reduce((a,s)=>a+(s.rr||0),0)/rrSessions.length : 0;
      return computeStats({...trader, pnl, trades, wins, rrMade});

  const ranked     = useMemo(()=>[...filteredStudents].sort((a,b)=>b.pnl-a.pnl).map((s,i)=>({...s,rank:i+1})),[filteredStudents]);
  const prevRanked = useMemo(()=>[...prevStudents].sort((a,b)=>b.pnl-a.pnl).map((s,i)=>({...s,rank:i+1})),[prevStudents]);
  const totals = useMemo(()=>({
    pnl:filteredStudents.reduce((a,x)=>a+x.pnl,0),
   wr:filteredStudents.filter(x=>x.trades>0).length?filteredStudents.filter(x=>x.trades>0).reduce((a,x)=>a+x.winRate,0)/filteredStudents.filter(x=>x.trades>0).length:0,
    trades:filteredStudents.reduce((a,x)=>a+x.trades,0),
    active:filteredStudents.length,
   rr:filteredStudents.reduce((a,x)=>a+x.rrMade,0)
  }),[filteredStudents]);
  const myCount    = user?sessions.filter(s=>s.user_id===user.id).length:0;

    setUser(u); setToast({msg:`Welcome, ${u.name}!`});

      // Delete all sessions
      await SUPA.from('sessions').delete().eq('user_id', uid);
      // Delete trader row
      await SUPA.from('traders').delete().eq('id', uid);
      // Delete profile
      await SUPA.from('profiles').delete().eq('id', uid);
      // Delete auth user via secure server-side function
      await SUPA.rpc('delete_own_account');
      // Sign out
      await SUPA.auth.signOut();
      setUser(null);
      setStudents(prev => prev.filter(s => s.id !== uid));
      setActivePage("leaderboard");
      setToast({msg:"Account deleted."});
    } catch(e) { setToast({msg:e.message||"Delete failed.",isError:true}); }
  };

  const handleDeleteSession = async (sessionId, targetUserId) => {
    const uid = targetUserId || user.id;
    try {
      // 1. Instantly remove session from local state
      const updatedSessions = sessions.filter(s => s.id !== sessionId);
      setSessions(updatedSessions);

      // 2. Instantly recalculate trader stats from remaining local sessions
      const rem = updatedSessions.filter(s => s.user_id === uid);
      const pnl    = rem.reduce((a,s)=>a+(s.pnl||0),0);
      const trades = rem.reduce((a,s)=>a+(s.trades||0),0);
      const wins   = rem.reduce((a,s)=>a+(s.wins||0),0);
      const rrSessions = rem.filter(s=>s.rr>0);
      const rr_made = rrSessions.length>0 ? rrSessions.reduce((a,s)=>a+(s.rr||0),0)/rrSessions.length : 0;
      const hide_pnl = rem.length===0 ? false : rem.some(s=>s.hide_pnl);

      // 3. Instantly update leaderboard UI — no waiting
      setStudents(prev => prev.map(t => t.id===uid
        ? computeStats({...t, pnl, trades, wins, rrMade:rr_made, hidePnl:hide_pnl})
        : t
      ));

      // 4. Sync to DB in background
      const {error} = await SUPA.from('sessions').delete().eq('id', sessionId);
      if(error) throw error;
      await SUPA.from('traders').update({pnl,trades,wins,rr_made,hide_pnl}).eq('id',uid);
      setToast({msg:"Session deleted."});
    } catch(e) { 
      // Revert on error
      fetchLeaderboard(); fetchSessions();
      setToast({msg:e.message||"Delete failed.",isError:true}); 
    }
  };

    try {
      await SUPA.from('sessions').delete().eq('user_id', traderId);
      await SUPA.from('traders').delete().eq('id', traderId);

      await fetchLeaderboard();
      await fetchSessions();
      setToast({msg:"User deleted."});

  };

    setUser(u=>({...u,pic:newUrl}));

    if(!newAvatarPic) return;
    setUploadingAvatar(true);
    try {
      // Convert base64 to blob
      const res = await fetch(newAvatarPic);
      const blob = await res.blob();
      const path = `avatars/${user.id}.jpg`;
      
      // Upload to storage
      const { error: uploadErr } = await SUPA.storage
        .from('Tickers-Proofs')
        .upload(path, blob, { contentType: 'image/jpeg', upsert: true });
      
      if(uploadErr) throw new Error('Upload failed: ' + uploadErr.message);
      
      // Get public URL
      const { data: urlData } = SUPA.storage
        .from('Tickers-Proofs')
        .getPublicUrl(path);
      
      const avatarUrl = urlData.publicUrl + '?t=' + Date.now(); // cache bust
      
      // Update DB
      await SUPA.from('profiles').update({ avatar_url: avatarUrl }).eq('id', user.id);
      await SUPA.from('traders').update({ avatar_url: avatarUrl }).eq('id', user.id);
      
      // Update local state
      setUser(u=>({...u, pic: avatarUrl}));
      fetchLeaderboard();
      setShowAvatarModal(false);
      setNewAvatarPic(null);
      setToast({msg:"Avatar updated! ✓"});
    } catch(e) {
      console.error('Avatar upload error:', e);
      setToast({msg: e.message || "Upload failed. Check storage permissions.", isError:true});
    }
    setUploadingAvatar(false);
  };

  const handleSubmit = async (data) => {
    const uid=user.id;
    try {
      /* upload screenshots to Supabase Storage */
      const proofUrls = await Promise.all(
        data.proofs.map(async (p,i) => {
          const ext = p.file.type.includes('png') ? 'png' : 'jpg';
          const path = `proofs/${uid}/${Date.now()}-${i}.${ext}`;
          return await uploadImg(p.preview, path);
        })
      );
      /* get current trader totals */
      const {data:cur}=await SUPA.from('traders').select('*').eq('id',uid).single();
      /* update leaderboard row */
      await SUPA.from('traders').update({
        pnl:     cur.pnl    + data.pnl,
        trades:  cur.trades + data.trades,
        wins:    cur.wins   + data.wins,
        hide_pnl: data.hidePnl,
        rr_made: data.rr > 0 ? ((cur.rr_made||0) * cur.trades + data.rr * data.trades) / (cur.trades + data.trades) : (cur.rr_made||0),

        trades:     data.trades,

                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><polygon points="12,2 22,20 2,20" fill="none" stroke="rgba(196,181,253,0.9)" strokeWidth="2" strokeLinejoin="round"/><polygon points="12,7 18,20 6,20" fill="rgba(196,181,253,0.18)" strokeLinejoin="round"/></svg>

            </div>
            {[
              {id:"leaderboard",label:"Leaderboard",icon:<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="2" y="12" width="4" height="10" rx="1" stroke="currentColor" strokeWidth="1.8"/><rect x="9" y="7" width="4" height="15" rx="1" stroke="currentColor" strokeWidth="1.8"/><rect x="16" y="2" width="4" height="20" rx="1" stroke="currentColor" strokeWidth="1.8"/></svg>},
              ...(user?[{id:"pnllogs",label:"PnL Logs",icon:<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/><polyline points="14,2 14,8 20,8" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/><line x1="9" y1="13" x2="15" y2="13" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/><line x1="9" y1="17" x2="13" y2="17" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>,badge:myCount}]:[]),

              orb(-60,60,380,"rgba(139,92,246,0.22)");

                  c.shadowBlur=0;

                  // Trades

                  c.beginPath();c.moveTo(40,ry+ROW-6);c.lineTo(W-40,ry+ROW-6);c.stroke();
                });

                // FOOTER
                const fy=H-28;
                c.font="700 9px 'SF Mono','Courier New',monospace";

                c.fillStyle="rgba(167,139,250,0.45)";
                c.textAlign="right";
                c.fillText(dlStamp,W-40,fy);

                gl.addColorStop(0,"transparent");gl.addColorStop(0.3,"rgba(139,92,246,0.7)");gl.addColorStop(0.7,"rgba(99,102,241,0.5)");gl.addColorStop(1,"transparent");
                c.strokeStyle=gl;c.lineWidth=2;

                img.onerror=()=>{loaded++;if(loaded===toLoad.length)drawRows(avatarImgs);};
                img.src=t.pic;
              });
            }}>

          <div style={{width:60,height:60,borderRadius:18,background:"rgba(255,60,60,0.1)",border:"1px solid rgba(255,60,60,0.28)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 22px",boxShadow:"0 0 30px rgba(255,60,60,0.25),inset 0 1px 0 rgba(255,255,255,0.05)"}}>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><polyline points="3,6 5,6 21,6" stroke="rgba(255,110,110,0.95)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" stroke="rgba(255,110,110,0.95)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><path d="M10 11v6M14 11v6" stroke="rgba(255,110,110,0.95)" strokeWidth="2" strokeLinecap="round"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2" stroke="rgba(255,110,110,0.95)" strokeWidth="2" strokeLinejoin="round"/></svg>
          </div>
          <div style={{fontSize:24,fontWeight:800,fontFamily:SANS,color:"#fff",marginBottom:10,letterSpacing:"-0.03em"}}>Delete Account?</div>
          <div style={{fontSize:14,fontFamily:SANS,color:"rgba(255,255,255,0.35)",lineHeight:1.75,marginBottom:30}}>
            This will permanently delete your account, leaderboard entry, and all PnL logs.<br/>
            <span style={{color:"rgba(255,100,100,0.85)",fontWeight:600}}>This cannot be undone.</span>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setConfirmDelAccount(false)} disabled={deletingAccount}
              style={{flex:1,padding:"14px",borderRadius:13,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.09)",color:"rgba(255,255,255,0.5)",fontFamily:MONO,fontSize:12,fontWeight:700,letterSpacing:"0.07em",cursor:"pointer",transition:"all 0.2s"}}
              onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,255,255,0.08)";e.currentTarget.style.color="#fff";e.currentTarget.style.borderColor="rgba(255,255,255,0.15)";}}
              onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,255,255,0.04)";e.currentTarget.style.color="rgba(255,255,255,0.5)";e.currentTarget.style.borderColor="rgba(255,255,255,0.09)";}}>CANCEL</button>
            <button onClick={async()=>{setDeletingAccount(true);await handleDeleteAccount();setDeletingAccount(false);setConfirmDelAccount(false);}} disabled={deletingAccount}
              style={{flex:1,padding:"14px",borderRadius:13,background:"rgba(255,60,60,0.14)",border:"1px solid rgba(255,60,60,0.38)",color:"rgba(255,110,110,0.95)",fontFamily:MONO,fontSize:12,fontWeight:700,letterSpacing:"0.07em",cursor:deletingAccount?"not-allowed":"pointer",transition:"all 0.2s",opacity:deletingAccount?0.7:1,display:"flex",alignItems:"center",justifyContent:"center",gap:8,boxShadow:"0 0 24px rgba(255,60,60,0.15)"}}
              onMouseEnter={e=>{if(!deletingAccount){e.currentTarget.style.background="rgba(255,60,60,0.24)";e.currentTarget.style.boxShadow="0 0 40px rgba(255,60,60,0.32)";e.currentTarget.style.borderColor="rgba(255,60,60,0.55)";}}}
              onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,60,60,0.14)";e.currentTarget.style.boxShadow="0 0 24px rgba(255,60,60,0.15)";e.currentTarget.style.borderColor="rgba(255,60,60,0.38)";}}>
              {deletingAccount?<><Spin/> DELETING...</>:"YES, DELETE"}
            </button>
          </div>
        </div>
      </div>}
    </div>
  );
}


function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
